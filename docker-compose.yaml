services:
  estudo_app:
    container_name: estudo_app
    build:
      context: "./.docker"
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - "./.:/var/www/html"

  estudo_web:
    container_name: estudo_web
    image: nginx:1.31-alpine
    ports:
      - "80:80"
    volumes:
      - "./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf"
      - "./.:/var/www/html"
    depends_on:
      - "estudo_app"